# Feature extraction environment (PyRadiomics).
# PyRadiomics 3.1.0a2 only ships builds for old Python versions, so extraction
# runs in its own Python 3.7 environment, separate from the modelling one.
#
#   conda env create -f environment-radiomics.yml
#   conda activate radiomics_env
name: radiomics_env
channels:
  - radiomics
  - simpleitk
  - conda-forge
  - defaults
dependencies:
  - python=3.7.1
  - pyradiomics=3.1.0a2
  - simpleitk=2.1.1.1
  - numpy=1.21.6
  - pandas=1.3.5
  - scipy=1.7.3
  - pywavelets=1.3.0
  - scikit-image=0.19.3
  - six=1.16.0
  - openpyxl=3.0.10
  - ipykernel
  - jupyter
  - pip
  - pip:
      - nibabel==4.0.2
      - opencv-python==4.10.0.84
